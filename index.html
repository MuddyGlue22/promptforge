<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptForge - TTRPG Character Image Prompt Builder</title>
<meta name="description" content="Build a structured AI image prompt for a tabletop RPG character.">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    background: #14110e;
    color: #1c1612;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 18px 60px;
  }
  header {
    color: #f6efe6;
    margin-bottom: 24px;
  }
  .eyebrow {
    margin: 0 0 6px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-size: 12px;
    color: #c9843a;
    font-family: Arial, sans-serif;
  }
  h1 {
    margin: 0;
    font-size: 44px;
    font-weight: normal;
  }
  header p {
    max-width: 600px;
    color: #d9cbbd;
    font-family: Arial, sans-serif;
    line-height: 1.5;
  }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
  }
  .panel {
    flex: 1 1 480px;
    background: #f6f0e6;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  .panel.output {
    flex: 1 1 360px;
    position: sticky;
    top: 16px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
  }
  button {
    font-family: Arial, sans-serif;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
    background: #e2d8c8;
    color: #1c1612;
  }
  button.primary {
    background: #7a3e1d;
    color: #f6efe6;
  }
  button:hover { filter: brightness(0.96); }
  .section-title {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7d6a58;
    border-bottom: 1px solid #d6c9b8;
    padding-bottom: 6px;
    margin: 22px 0 14px;
  }
  label {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 14px;
    margin-bottom: 14px;
    color: #3a2f26;
  }
  select, input[type=text], textarea {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    font-family: Arial, sans-serif;
    font-size: 15px;
    border: 1px solid #c9bba9;
    border-radius: 10px;
    background: #fffdf9;
    color: #1c1612;
  }
  textarea {
    min-height: 260px;
    resize: vertical;
    font-family: "Courier New", monospace;
    font-size: 14px;
    line-height: 1.5;
  }
  .other-input {
    margin-top: 8px;
    display: none;
  }
  .other-input.show { display: block; }
  .checks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }
  .checks label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    background: #fffdf9;
    border: 1px solid #d6c9b8;
    border-radius: 10px;
    padding: 8px 10px;
  }
  @media (max-width: 700px) {
    h1 { font-size: 34px; }
    .panel { padding: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">PromptForge</p>
    <h1>Character Image Prompt Builder</h1>
    <p>Choose a ruleset, ancestry, class, setting, and gear, then copy a structured prompt for your image generator.</p>
  </header>

  <div class="layout">
    <div class="panel" id="form-panel">
      <div class="toolbar">
        <button type="button" id="randomize" class="primary">Randomize</button>
        <button type="button" id="clear">Clear</button>
      </div>

      <div class="section-title">Character</div>

      <label>Ruleset
        <select id="ruleset"></select>
      </label>

      <label>Ancestry
        <select id="ancestry"></select>
        <input type="text" id="ancestry-other" class="other-input" placeholder="Describe the ancestry">
      </label>

      <label>Class
        <select id="class"></select>
        <input type="text" id="class-other" class="other-input" placeholder="Describe the class">
      </label>

      <label>Gender
        <select id="gender"></select>
      </label>

      <label>Age
        <select id="age"></select>
      </label>

      <label>Build
        <select id="build"></select>
      </label>

      <div class="section-title">Appearance</div>

      <label>Hair
        <select id="hair"></select>
        <input type="text" id="hair-other" class="other-input" placeholder="Describe the hair">
      </label>

      <label>Eyes
        <select id="eyes"></select>
        <input type="text" id="eyes-other" class="other-input" placeholder="Describe the eyes">
      </label>

      <label>Skin
        <select id="skin"></select>
        <input type="text" id="skin-other" class="other-input" placeholder="Describe the skin">
      </label>

      <label>Expression
        <select id="expression"></select>
      </label>

      <label>Distinguishing marks
        <input type="text" id="marks" placeholder="Scars, tattoos, horns, etc.">
      </label>

      <div class="section-title">Gear</div>

      <label>Weapon
        <select id="weapon"></select>
      </label>

      <label>Armour
        <select id="armour"></select>
      </label>

      <label>Accessories
        <div class="checks" id="accessories"></div>
      </label>

      <div class="section-title">Scene</div>

      <label>Framing
        <select id="framing"></select>
      </label>

      <label>Setting
        <select id="setting"></select>
      </label>

      <label>Lighting
        <select id="lighting"></select>
      </label>

      <label>Pose
        <select id="pose"></select>
      </label>

      <label>Art style
        <select id="style"></select>
      </label>

      <label>Extra notes
        <textarea id="notes" style="min-height:90px" placeholder="Anything else to include in the prompt"></textarea>
      </label>
    </div>

    <div class="panel output">
      <div class="toolbar">
        <button type="button" id="copy" class="primary">Copy prompt</button>
      </div>
      <label>Generated prompt
        <textarea id="output" readonly></textarea>
      </label>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);

// ---------- data ----------
const DATA = {
  rulesets: ["Daggerheart", "D&D 5e", "Pathfinder 2e", "Generic Fantasy"],

  ancestries: {
    "Daggerheart": [
      "Clank", "Ribit", "Katari", "Drakona", "Faerie", "Fungril",
      "Galapa", "Giant", "Goblin", "Greataxe Orc", "Infernis",
      "Simiah", "Seraph", "Wyrmling", "Other"
    ],
    "D&D 5e": [
      "Human", "Elf", "Dwarf", "Halfling", "Dragonborn", "Gnome",
      "Half-Elf", "Half-Orc", "Tiefling", "Aasimar", "Other"
    ],
    "Pathfinder 2e": [
      "Human", "Elf", "Dwarf", "Gnome", "Goblin", "Halfling",
      "Leshy", "Lizardfolk", "Orc", "Tengu", "Other"
    ],
    "Generic Fantasy": [
      "Human", "Elf", "Dwarf", "Orc", "Beastfolk", "Undead", "Other"
    ]
  },

  classes: {
    "Daggerheart": [
      "Bard", "Druid", "Guardian", "Ranger", "Rogue", "Seraph",
      "Sorcerer", "Warrior", "Wizard", "Other"
    ],
    "D&D 5e": [
      "Barbarian", "Bard", "Cleric", "Druid", "Fighter", "Monk",
      "Paladin", "Ranger", "Rogue", "Sorcerer", "Warlock", "Wizard", "Other"
    ],
    "Pathfinder 2e": [
      "Alchemist", "Barbarian", "Bard", "Champion", "Cleric", "Druid",
      "Fighter", "Monk", "Ranger", "Rogue", "Sorcerer", "Wizard", "Other"
    ],
    "Generic Fantasy": [
      "Warrior", "Ranger", "Rogue", "Wizard", "Sorcerer", "Cleric",
      "Druid", "Bard", "Paladin", "Monk", "Barbarian", "Other"
    ]
  },

  genders: ["Male", "Female", "Non-binary", "Androgynous"],
  ages: ["Young", "Adult", "Middle-aged", "Elderly", "Ageless"],
  builds: ["Slender", "Athletic", "Stocky", "Heavy", "Lanky", "Muscular"],
  hairs: ["Black", "Brown", "Blonde", "Red", "White", "Silver", "Blue", "Green", "Bald", "Shaved"],
  eyes: ["Brown", "Blue", "Green", "Amber", "Violet", "Gold", "Red", "Glowing", "Heterochromatic"],
  skins: ["Pale", "Fair", "Olive", "Tan", "Brown", "Dark", "Blue", "Green", "Grey", "Scaled"],
  weapons: [
    "None visible", "Longsword", "Greataxe", "Warhammer", "Shortbow", "Longbow",
    "Staff", "Rapier", "Dagger pair", "Crossbow", "Glaive", "Spellbook"
  ],
  armours: [
    "Cloth robes", "Leather", "Studded leather", "Chain shirt", "Scale mail",
    "Plate", "Half plate", "Light cloak", "Ceremonial vestments", "None"
  ],
  accessories: [
    "Cloak", "Hood", "Pauldron", "Gauntlets", "Circlet", "Amulet",
    "Satchel", "Tabard", "Eye patch", "Scarf", "Spectacles", "Feathered cap"
  ],
  settings: [
    "Dungeon", "Forest", "Ruined city", "Tavern", "Mountain pass",
    "Desert ruins", "Frozen tundra", "Swamp", "Castle courtyard", "Plain studio backdrop"
  ],
  lightings: [
    "Soft natural light", "Dramatic side light", "Warm firelight", "Moonlight",
    "Overcast daylight", "Magical glow", "Rim light", "Studio lighting"
  ],
  framings: ["Full body", "Three-quarter", "Waist up", "Portrait"],
  expressions: [
    "Determined", "Confident", "Grim", "Wary", "Cheerful", "Serene",
    "Fierce", "Mischievous", "Weary", "Haunted"
  ],
  poses: [
    "Standing heroically", "Mid-action", "Crouched and alert", "Arms crossed",
    "Leaning on weapon", "Casting a spell", "Looking over shoulder", "Relaxed stance"
  ],
  styles: [
    "Painterly fantasy illustration", "Dark fantasy painting", "Watercolour",
    "Digital concept art", "Ink and wash", "Classic oil painting", "Anime-inspired"
  ]
};

// Full descriptions used in the generated prompt (not shown in the dropdown)
const CLASS_DETAILS = {
  "Bard": "with a musical instrument close at hand, flamboyant layered clothing, and a confident, expressive bearing",
  "Druid": "dressed in natural materials like leaves, bark, and bone, with moss or vines woven into their gear",
  "Guardian": "braced behind a heavy shield, broad-shouldered and firmly planted, in battle-scarred armour",
  "Ranger": "in weathered, earth-toned travel layers, with a quiver, a hunting knife, and road-worn boots",
  "Rogue": "in dark, close-fitting clothing with hidden blades and pouches, half in shadow, with a sly, watchful look",
  "Seraph": "in gleaming armour marked with holy symbols, surrounded by a faint radiant light",
  "Sorcerer": "with raw magic crackling around their hands and subtle signs of a magical bloodline in their features",
  "Warrior": "in practical, battle-worn gear, with visible scars and a well-used weapon",
  "Wizard": "with ink-stained fingers, a satchel of scrolls, and faint arcane sigils glowing in the air nearby",
  "Barbarian": "with furs, bare muscular arms, war paint, and a wild, untamed look",
  "Cleric": "with a prominently displayed holy symbol, vestments worn over armour, and a soft divine glow",
  "Fighter": "in well-maintained armour, with the disciplined bearing of a trained soldier",
  "Monk": "in simple, loose-fitting garments, with wrapped hands and a calm, centred posture",
  "Paladin": "in polished armour bearing a sacred emblem, with a tabard and an air of righteous resolve",
  "Warlock": "with eldritch markings on the skin, an eerie otherworldly glow, and a token of their patron",
  "Alchemist": "with bandoliers of glass vials, goggles, stained gloves, and a bubbling flask in hand",
  "Champion": "in shining armour bearing a deity's emblem, with a shield raised protectively"
};

const FRAMING_DETAILS = {
  "Full body": "full-body shot, the entire character visible from head to toe",
  "Three-quarter": "three-quarter shot, framed from the knees up",
  "Waist up": "medium shot, framed from the waist up",
  "Portrait": "close-up portrait, head and shoulders"
};

const ANCESTRY_DETAILS = {
  "Clank": "a sentient, mechanical being of metal and gears, with visible rivets, hinges, and a glowing core",
  "Ribit": "a frog-like humanoid with smooth, damp skin, large eyes, and webbed hands and feet",
  "Katari": "a feline humanoid with fur, whiskers, and retractable claws",
  "Drakona": "a draconic humanoid with scales, horns, and a tail",
  "Faerie": "a small winged fey with translucent wings and luminous features",
  "Fungril": "a mushroom-folk humanoid with a cap of fungus instead of hair and spore-dusted skin",
  "Galapa": "a turtle-like humanoid with a hard shell on the back and a slow, deliberate manner",
  "Giant": "a towering humanoid, many times the height of a person",
  "Goblin": "a small, quick-witted humanoid with large ears and sharp features",
  "Greataxe Orc": "a muscular orc-like humanoid, heavily built and tusked",
  "Infernis": "a fiend-touched humanoid with horns and ember-colored eyes",
  "Simiah": "an ape-like humanoid with long arms, a thick brow, and expressive features",
  "Seraph": "a celestial humanoid with feathered wings and a radiant bearing",
  "Wyrmling": "a young dragon-kin humanoid with small horns, a scaled tail, and keen eyes"
};

const NO_HAIR_ANCESTRIES = ["Clank", "Ribit", "Galapa", "Fungril", "Infernis", "Drakona", "Wyrmling"];

// ---------- helpers ----------
function fillSelect(sel, items) {
  sel.innerHTML = "";
  items.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item;
    opt.textContent = item;
    sel.appendChild(opt);
  });
}

function fillChecks(container, items) {
  container.innerHTML = "";
  items.forEach(item => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = item;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(item));
    container.appendChild(label);
  });
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function indefinite(word) {
  return /^[aeiou]/i.test(word) ? "an" : "a";
}

function toggleOther(selectId, inputId) {
  const isOther = $(selectId).value === "Other";
  $(inputId).classList.toggle("show", isOther);
}

const FREE_TEXT_TRAITS = ["hair", "eyes", "skin"];

function toggleTraitOthers() {
  FREE_TEXT_TRAITS.forEach(id => toggleOther(id, `${id}-other`));
}

// Returns the trait text for the prompt, or "" if "Other" was chosen but left blank.
function traitText(id) {
  if ($(id).value === "Other") return $(`${id}-other`).value.trim();
  return $(id).value.toLowerCase();
}

function refreshAncestries() {
  const ruleset = $("ruleset").value;
  fillSelect($("ancestry"), DATA.ancestries[ruleset]);
  fillSelect($("class"), DATA.classes[ruleset]);
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
}

function stripArticle(text) {
  return text.replace(/^(a|an)\s+/i, "");
}

// Ancestry as a noun phrase with no leading article, e.g. "draconic humanoid with scales...".
function ancestryText() {
  const choice = $("ancestry").value;
  if (choice === "Other") return stripArticle($("ancestry-other").value.trim()) || "humanoid of unusual ancestry";
  return stripArticle(ANCESTRY_DETAILS[choice] || choice);
}

// Class with its article and visual cues, e.g. "a wizard, with ink-stained fingers...".
function classDescription() {
  const choice = $("class").value;
  if (choice === "Other") {
    const custom = stripArticle($("class-other").value.trim());
    return custom ? `${indefinite(custom)} ${custom}` : "a unique adventurer";
  }
  const name = choice.toLowerCase();
  const cues = CLASS_DETAILS[choice];
  return `${indefinite(name)} ${name}` + (cues ? `, ${cues}` : "");
}

// ---------- prompt building ----------
function buildPrompt() {
  const selectedAccessories = [...$("accessories").querySelectorAll("input:checked")]
    .map(cb => cb.value);

  const ancestry = ancestryText();
  const classDesc = classDescription();
  const noHair = NO_HAIR_ANCESTRIES.includes($("ancestry").value);

  const sections = [];

  const age = $("age").value.toLowerCase();
  const subject =
    `${indefinite(age)} ${age}, ${$("build").value.toLowerCase()} ${$("gender").value.toLowerCase()} ` +
    `${ancestry}, portrayed as ${classDesc}.`;
  sections.push(
    "SUBJECT\n" +
    subject.charAt(0).toUpperCase() + subject.slice(1) + " " +
    `A character from the ${$("ruleset").value} tabletop RPG.`
  );

  const appearance = [];
  const hair = traitText("hair"), eyes = traitText("eyes"), skin = traitText("skin");
  if (!noHair && hair) appearance.push(`hair: ${hair}`);
  if (eyes) appearance.push(`eyes: ${eyes}`);
  if (skin) appearance.push(`skin: ${skin}`);
  appearance.push(`expression: ${$("expression").value.toLowerCase()}`);
  if ($("marks").value.trim()) appearance.push(`distinguishing marks: ${$("marks").value.trim()}`);
  sections.push(`APPEARANCE\n${appearance.join(", ")}.`);
  
  const weapon = $("weapon").value;
  const handsPart = weapon === "None visible" ? "empty hands" : `carrying ${weapon.toLowerCase()}`;
  const accessories = [...$("accessories").querySelectorAll("input:checked")].map(cb => cb.value);
  const gear = [`wearing ${$("armour").value.toLowerCase()}`, handsPart];
  if (accessories.length) gear.push(`accessories: ${accessories.join(", ").toLowerCase()}`);
  sections.push(`GEAR\n${gear.join(", ")}.`);

  sections.push(
    "SCENE\n" +
    `Framing: ${FRAMING_DETAILS[$("framing").value]}. ` +
    `Pose: ${$("pose").value.toLowerCase()}. ` +
    `Setting: ${$("setting").value.toLowerCase()}. ` +
    `Lighting: ${$("lighting").value.toLowerCase()}.`
  );

  sections.push(`STYLE\n${$("style").value}.`);

  if ($("notes").value.trim()) sections.push(`NOTES\n${$("notes").value.trim()}`);

  sections.push(
    "REQUIREMENTS\n" +
    "A single character, clearly the focus of the image. Correct anatomy with natural hands. " +
    "No text, captions, watermarks, signatures, or borders."
  );

  $("output").value = "Generate an image.\n\n" + sections.join("\n\n");
}

// ---------- randomise / clear ----------
function randomize() {
  $("ruleset").value = pick(DATA.rulesets);
  refreshAncestries();
  $("ancestry").value = pick(DATA.ancestries[$("ruleset").value]);
  $("class").value = pick(DATA.classes[$("ruleset").value]);
  $("gender").value = pick(DATA.genders);
  $("age").value = pick(DATA.ages);
  $("build").value = pick(DATA.builds);
  $("hair").value = pick(DATA.hairs);
  $("eyes").value = pick(DATA.eyes);
  $("skin").value = pick(DATA.skins);
  $("expression").value = pick(DATA.expressions);
  $("framing").value = pick(DATA.framings);
  $("weapon").value = pick(DATA.weapons);
  $("armour").value = pick(DATA.armours);
  $("setting").value = pick(DATA.settings);
  $("lighting").value = pick(DATA.lightings);
  $("pose").value = pick(DATA.poses);
  $("style").value = pick(DATA.styles);
  document.querySelectorAll("#accessories input").forEach(cb => {
    cb.checked = Math.random() < 0.25;
  });
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  toggleTraitOthers();
  buildPrompt();
}

function clearAll() {
  document.querySelectorAll("input[type=text], textarea").forEach(el => el.value = "");
  document.querySelectorAll("#accessories input").forEach(cb => cb.checked = false);
  document.querySelectorAll("select").forEach(sel => sel.selectedIndex = 0);
  refreshAncestries();
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  toggleTraitOthers();
  buildPrompt();
}

// ---------- init ----------
function init() {
  fillSelect($("ruleset"), DATA.rulesets);
  refreshAncestries();
  fillSelect($("gender"), DATA.genders);
  fillSelect($("age"), DATA.ages);
  fillSelect($("build"), DATA.builds);
  fillSelect($("hair"), [...DATA.hairs, "Other"]);
  fillSelect($("eyes"), [...DATA.eyes, "Other"]);
  fillSelect($("skin"), [...DATA.skins, "Other"]);
  fillSelect($("expression"), DATA.expressions);
  fillSelect($("framing"), DATA.framings);
  fillSelect($("weapon"), DATA.weapons);
  fillSelect($("armour"), DATA.armours);
  fillChecks($("accessories"), DATA.accessories);
  fillSelect($("setting"), DATA.settings);
  fillSelect($("lighting"), DATA.lightings);
  fillSelect($("pose"), DATA.poses);
  fillSelect($("style"), DATA.styles);

  $("ruleset").addEventListener("change", refreshAncestries);
  $("ancestry").addEventListener("change", () => toggleOther("ancestry", "ancestry-other"));
  $("class").addEventListener("change", () => toggleOther("class", "class-other"));
  FREE_TEXT_TRAITS.forEach(id =>
    $(id).addEventListener("change", () => toggleOther(id, `${id}-other`)));

  document.querySelectorAll("#form-panel select, #form-panel input, #form-panel textarea")
    .forEach(el => el.addEventListener("input", buildPrompt));
  document.querySelectorAll("#form-panel select").forEach(el => el.addEventListener("change", buildPrompt));
  document.querySelectorAll("#accessories input").forEach(cb => cb.addEventListener("change", buildPrompt));

  $("randomize").addEventListener("click", randomize);
  $("clear").addEventListener("click", clearAll);
  $("copy").addEventListener("click", () => {
    navigator.clipboard.writeText($("output").value);
  });

  buildPrompt();
}

init();
</script>
</body>
</html>

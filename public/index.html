<div class="wrap">

    <p class="eyebrow">Tavern Portraits</p>

  <div class="layout">
    <div class="panel" id="form-panel">

        <button type="button" id="clear">Clear</button>
      </div>

      <div class="section-title">Character</div>

      <label>Ruleset
        <select id="ruleset"></select>
      </label>

        <select id="ancestry"></select>
        <input type="text" id="ancestry-other" class="other-input" placeholder="Describe the ancestry">
      </label>

      <label>Class
        <select id="class"></select>
        <input type="text" id="class-other" class="other-input" placeholder="Describe the class">
      </label>

      <label>Gender
        <select id="gender"></select>
      </label>

      <label>Age
        <select id="age"></select>
      </label>

      <label>Build
        <select id="build"></select>
      </label>

      <div class="section-title">Appearance</div>

      <label id="hair-field">Hair
        <select id="hair"></select>
        <input type="text" id="hair-other" class="other-input" placeholder="Describe the hair">
      </label>

      <label>Eyes
        <select id="eyes"></select>
        <input type="text" id="eyes-other" class="other-input" placeholder="Describe the eyes">
      </label>

      <label><span id="skin-label">Skin</span>
        <select id="skin"></select>
        <input type="text" id="skin-other" class="other-input" placeholder="Describe the skin">
      </label>

      <label>Expression
        <select id="expression"></select>
      </label>

      <label>Distinguishing marks
        <input type="text" id="marks" placeholder="Scars, tattoos, horns, etc.">
      </label>

      <div class="section-title">Gear</div>

      <label>Weapon
        <select id="weapon"></select>
      </label>

      <label>Armour
        <select id="armour"></select>
      </label>

      <label>Accessories
        <div class="checks" id="accessories"></div>
      </label>

      <div class="section-title">Scene</div>

      <label>Framing
        <select id="framing"></select>
        <span class="field-hint" id="framing-hint" hidden>Painted miniatures are always full body, so the base is in view.</span>
      </label>

      <label>Setting
        <select id="setting"></select>
      </label>

      <label>Lighting
        <select id="lighting"></select>
      </label>

      <label>Pose
        <select id="pose"></select>
      </label>

      <label>Art style
        <select id="style"></select>
      </label>

      <label>Image model
        <select id="target-model"></select>
      </label>

      <label>Extra notes
        <textarea id="notes" style="min-height:90px" placeholder="Anything else to include in the prompt"></textarea>
      </label>

    <div class="panel output">
      <div class="toolbar">
        <button type="button" id="copy" class="primary">Copy prompt</button>
        <button type="button" id="share">Share character</button>
      </div>
      <label>Generated prompt

      </label>
    </div>
  </div>

  "Human": "a human",

// What the "Skin" field describes for ancestries without ordinary skin.
const SURFACE_LABELS = {

  "Drakona": "Scales",
  "Dragonborn": "Scales",
  "Lizardfolk": "Scales",
  "Katari": "Fur",
  "Firbolg": "Fur",
  "Tengu": "Feathers",
  "Leshy": "Bark"

const NO_HAIR_ANCESTRIES = [

  "Dragonborn", "Lizardfolk", "Tengu", "Leshy"
];

// ---------- helpers ----------
function fillSelect(sel, items) {
  sel.innerHTML = "";
  items.forEach(item => {
    const opt = document.createElement("option");
    opt.value = item;
    opt.textContent = item;
    sel.appendChild(opt);
  });
}

function fillChecks(container, items) {
  container.innerHTML = "";
  items.forEach(item => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = item;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(item));
    container.appendChild(label);
  });
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function indefinite(word) {
  return /^[aeiou]/i.test(word) ? "an" : "a";
}

function toggleOther(selectId, inputId) {
  const isOther = $(selectId).value === "Other";
  $(inputId).classList.toggle("show", isOther);
}

const FREE_TEXT_TRAITS = ["hair", "eyes", "skin"];

function toggleTraitOthers() {
  FREE_TEXT_TRAITS.forEach(id => toggleOther(id, `${id}-other`));
}

// Returns the trait text for the prompt, or "" if "Other" was chosen but left blank.
function traitText(id) {
  if ($(id).value === "Other") return $(`${id}-other`).value.trim();
  return $(id).value.toLowerCase();
}

function surfaceLabel() {
  return SURFACE_LABELS[$("ancestry").value] || "Skin";
}

// Hide Hair for hairless ancestries and rename Skin to fit (scales, fur, ...).
function updateAncestryFields() {
  $("hair-field").hidden = NO_HAIR_ANCESTRIES.includes($("ancestry").value);
  const label = surfaceLabel();
  $("skin-label").textContent = label;
  $("skin-other").placeholder = `Describe the ${label.toLowerCase()}`;
}

function refreshAncestries() {
  const ruleset = $("ruleset").value;
  fillSelect($("ancestry"), DATA.ancestries[ruleset]);
  fillSelect($("class"), DATA.classes[ruleset]);
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  updateAncestryFields();
}

function stripArticle(text) {
  return text.replace(/^(a|an)\s+/i, "");
}

// Where a ruleset's version of an ancestry looks different from the usual one.
const RULESET_ANCESTRY_DETAILS = {
  "Daggerheart": {
    "Dwarf": "a dwarf, short and broad with a square frame, dense muscle, thick hair, and often an elaborately styled beard, sometimes with gemstones embedded in the skin",
    "Goblin": "a goblin, a small humanoid with large eyes and huge membranous ears, each about the size of their head",
    "Halfling": "a halfling, small, about three and a half feet tall, with large, hairy bare feet and prominent rounded ears",
    "Orc": "an orc with square features, boar-like tusks jutting from the lower jaw, often decorated with ornaments, pointed ears, and a muscular build",
    "Gnome": "a gnome, about three feet tall, with a large conical head, softly pointed ears, wide eyes, a square frame with short legs, and long arms with large, dexterous hands"
  }
};

// Ancestry as a noun phrase with no leading article, e.g. "draconic humanoid with scales...".
function ancestryText() {
  const choice = $("ancestry").value;
  if (choice === "Other") return stripArticle($("ancestry-other").value.trim()) || "humanoid of unusual ancestry";
  const own = (RULESET_ANCESTRY_DETAILS[$("ruleset").value] || {})[choice];
  return stripArticle(own || ANCESTRY_DETAILS[choice] || choice);
}

// Class with its article and visual cues, e.g. "a wizard, with ink-stained fingers...".
function classDescription() {
  const choice = $("class").value;
  if (choice === "Other") {
    const custom = stripArticle($("class-other").value.trim());
    return custom ? `${indefinite(custom)} ${custom}` : "a unique adventurer";
  }
  const name = choice.toLowerCase();
  const cues = CLASS_DETAILS[choice];
  return `${indefinite(name)} ${name}` + (cues ? `, ${cues}` : "");
}

// FLUX treats every word as something to include, so "no logos" can add a logo.
// For FLUX, describe the clean result instead of listing what to avoid.
function requirementsText() {
  const base = "A single character, clearly the focus of the image. Correct anatomy with natural hands. ";
  if ($("target-model").value === "FLUX") {
    return base + "Clean, unmarked artwork: the corners and edges show only the scene itself.";
  }
  return base + "No text, lettering, logos, brand marks, captions, watermarks, signatures, or borders.";
}

// ---------- prompt building ----------
function buildPrompt() {
  const selectedAccessories = [...$("accessories").querySelectorAll("input:checked")]
    .map(cb => cb.value);

  const ancestry = ancestryText();
  const classDesc = classDescription();
  const noHair = NO_HAIR_ANCESTRIES.includes($("ancestry").value);

  const sections = [];

  // "Young" alone can read as a child, which some image models refuse; say adult plainly.
  const age = $("age").value === "Young" ? "young adult" : $("age").value.toLowerCase();
  const subject =
    `${indefinite(age)} ${age}, ${$("build").value.toLowerCase()} ${$("gender").value.toLowerCase()} ` +
    `${ancestry}, portrayed as ${classDesc}.`;
  sections.push(
    "SUBJECT\n" +
    subject.charAt(0).toUpperCase() + subject.slice(1) + " " +
    "A fantasy tabletop RPG character."
  );

  const appearance = [];
  const hair = traitText("hair"), eyes = traitText("eyes"), skin = traitText("skin");
  if (!noHair && hair) appearance.push(`hair: ${hair}`);
  if (eyes) appearance.push(`eyes: ${eyes}`);
  if (skin) appearance.push(`${surfaceLabel().toLowerCase()}: ${skin}`);
  appearance.push(`expression: ${$("expression").value.toLowerCase()}`);
  if ($("marks").value.trim()) appearance.push(`distinguishing marks: ${$("marks").value.trim()}`);
  sections.push(`APPEARANCE\n${appearance.join(", ")}.`);
  
  const weapon = $("weapon").value;
  const handsPart = weapon === "None visible" ? "empty hands"
    : `carrying ${WEAPON_DETAILS[weapon] || weapon.toLowerCase()}`;
  const accessories = [...$("accessories").querySelectorAll("input:checked")].map(cb => cb.value);
  const armour = $("armour").value;
  const gear = [`wearing ${ARMOUR_DETAILS[armour] || armour.toLowerCase()}`, handsPart];
  if (accessories.length) gear.push(`accessories: ${accessories.join(", ").toLowerCase()}`);
  sections.push(`GEAR\n${gear.join(", ")}.`);

  sections.push(
    "SCENE\n" +
    `Framing: ${$("style").value === MINIATURE_STYLE ? MINIATURE_FRAMING : FRAMING_DETAILS[$("framing").value]}. ` +
    `Pose: ${$("pose").value.toLowerCase()}. ` +
    `Setting: ${$("setting").value.toLowerCase()}. ` +
    `Lighting: ${$("lighting").value.toLowerCase()}.`
  );

  const style = $("style").value;
  sections.push(`STYLE\n${STYLE_DETAILS[style] || style}.`);

  if ($("notes").value.trim()) sections.push(`NOTES\n${$("notes").value.trim()}`);

  sections.push("REQUIREMENTS\n" + requirementsText());

  $("output").value = "Generate an image.\n\n" + sections.join("\n\n");
}

// Painted miniatures are always full body: lock Framing while that style is chosen,
// and give back the previous choice when the style changes.
function syncStyleFraming() {
  const framing = $("framing");
  const mini = $("style").value === MINIATURE_STYLE;
  if (mini && !framing.disabled) {
    framing.dataset.previous = framing.value;
    framing.value = "Full body";
  } else if (!mini && framing.disabled) {
    if (framing.dataset.previous) framing.value = framing.dataset.previous;
    delete framing.dataset.previous;
  }
  framing.disabled = mini;
  $("framing-hint").hidden = !mini;
}

// characters make sense; every option stays available when choosing by hand.

  "Cleric":    { weapons: ["Warhammer", "Staff", "Longsword"], armour: ["Chain shirt", "Scale mail", "Half plate", "Ceremonial vestments"] },

  "Ranger":    { weapons: ["Longbow", "Shortbow", "Dagger pair", "Longsword"], armour: ["Leather", "Studded leather", "Chain shirt", "Light cloak"] },
  "Assassin":  { weapons: ["Dagger pair", "Crossbow", "Rapier", "Shortbow"], armour: ["Leather", "Studded leather", "Light cloak"] },

  "Witch":     { weapons: ["Staff", "Spellbook", "Dagger pair", "None visible"], armour: ["Cloth robes", "Light cloak", "Leather"] },
  "Rogue":     { weapons: ["Dagger pair", "Rapier", "Shortbow", "Crossbow"], armour: ["Leather", "Studded leather", "Light cloak"] },
  "Seraph":    { weapons: ["Longsword", "Warhammer", "Glaive", "Staff"], armour: ["Plate", "Half plate", "Chain shirt", "Ceremonial vestments"] },
  "Sorcerer":  { weapons: ["Staff", "Dagger pair", "None visible"], armour: ["Cloth robes", "Light cloak", "Leather"] },
  "Warlock":   { weapons: ["Spellbook", "Staff", "Dagger pair", "None visible"], armour: ["Light cloak", "Leather", "Cloth robes"] },
  "Warrior":   { weapons: ["Longsword", "Greataxe", "Warhammer", "Glaive", "Longbow"], armour: ["Chain shirt", "Scale mail", "Half plate", "Plate", "Leather"] },

};
const SPELLCASTERS = ["Bard", "Champion", "Cleric", "Druid", "Paladin", "Ranger", "Seraph", "Sorcerer", "Warlock", "Witch", "Wizard"];
const NOTHING_TO_LEAN_ON = ["None visible", "Spellbook", "Dagger pair"];

function randomPose(cls, weapon) {
  return pick(DATA.poses.filter(pose =>
    !(pose === "Casting a spell" && cls in CLASS_GEAR && !SPELLCASTERS.includes(cls)) &&
    !(pose === "Leaning on weapon" && NOTHING_TO_LEAN_ON.includes(weapon))));
}

function randomize() {
  $("ruleset").value = pick(DATA.rulesets);
  refreshAncestries();
  $("ancestry").value = pick(DATA.ancestries[$("ruleset").value].filter(a => a !== "Other"));
  updateAncestryFields();
  $("class").value = pick(DATA.classes[$("ruleset").value].filter(c => c !== "Other"));
  $("gender").value = pick(DATA.genders);
  $("age").value = pick(DATA.ages);
  $("build").value = pick(DATA.builds);
  $("hair").value = pick(DATA.hairs);
  $("eyes").value = pick(DATA.eyes);
  $("skin").value = pick(DATA.skins);
  $("expression").value = pick(DATA.expressions);
  $("framing").value = pick(DATA.framings);
  const gear = CLASS_GEAR[$("class").value];
  $("weapon").value = pick(gear ? gear.weapons : DATA.weapons);
  $("armour").value = pick(gear ? gear.armour : DATA.armours);
  $("setting").value = pick(DATA.settings);
  $("lighting").value = pick(DATA.lightings);
  $("pose").value = randomPose($("class").value, $("weapon").value);
  $("style").value = pick(DATA.styles);
  $("framing").disabled = false; // let syncStyleFraming start fresh
  delete $("framing").dataset.previous;
  syncStyleFraming();
  document.querySelectorAll("#accessories input").forEach(cb => {
    cb.checked = Math.random() < 0.25;
  });
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  toggleTraitOthers();
  buildPrompt();
}

function clearAll() {
  document.querySelectorAll("input[type=text], textarea").forEach(el => el.value = "");
  document.querySelectorAll("#accessories input").forEach(cb => cb.checked = false);
  const model = $("target-model").value; // a preference, not part of the character
  document.querySelectorAll("select").forEach(sel => sel.selectedIndex = 0);
  $("target-model").value = model;
  $("framing").disabled = false;
  delete $("framing").dataset.previous;
  syncStyleFraming();
  refreshAncestries();
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  toggleTraitOthers();
  buildPrompt();
}

// ---------- settings from the URL ----------
// e.g. /?ruleset=D%26D+5e&ancestry=Tiefling&class=Warlock&accessories=Amulet,Cloak
// Used by the gallery's "Try this character" links; unknown keys and values are ignored.
function applyUrlSettings() {
  const params = new URLSearchParams(window.location.search);
  if (!params.toString()) return;
  const setField = (id, value) => {
    const el = document.getElementById(id);
    if (!el || !el.closest("#form-panel")) return;
    if (el.tagName === "SELECT") {
      if ([...el.options].some(o => o.value === value)) el.value = value;
    } else if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
      el.value = value;
    }
  };
  if (params.has("ruleset")) {
    setField("ruleset", params.get("ruleset"));
    refreshAncestries();
  }
  params.forEach((value, key) => {
    if (key !== "ruleset" && key !== "accessories") setField(key, value);
  });
  if (params.has("accessories")) {
    const wanted = params.get("accessories").split(",");
    document.querySelectorAll("#accessories input").forEach(cb => {
      cb.checked = wanted.includes(cb.value);
    });
  }
  toggleOther("ancestry", "ancestry-other");
  toggleOther("class", "class-other");
  toggleTraitOthers();
  updateAncestryFields();
  syncStyleFraming();
}

// ---------- copy ----------
// Briefly swap a button's label to confirm an action.
function flash(btn, message) {
  if (!btn._label) btn._label = btn.textContent;
  btn.textContent = message;
  btn.classList.add("copied");
  clearTimeout(btn._reset);
  btn._reset = setTimeout(() => {
    btn.textContent = btn._label;
    btn.classList.remove("copied");
  }, 1600);
}

function copyPrompt(btn) {
  navigator.clipboard.writeText($("output").value).then(() => flash(btn, "Copied!"));
}

// A link that reopens the builder with the current character (read by applyUrlSettings).
function shareUrl() {
  const params = new URLSearchParams();
  document.querySelectorAll("#form-panel select, #form-panel input[type=text], #form-panel textarea")
    .forEach(el => {
      if (!el.id) return;
      const value = el.tagName === "SELECT" ? el.value : el.value.trim();
      if (value) params.set(el.id, value);
    });
  const accessories = [...document.querySelectorAll("#accessories input:checked")].map(cb => cb.value);
  if (accessories.length) params.set("accessories", accessories.join(","));
  return `${window.location.origin}${window.location.pathname}?${params}`;
}

// Phones get the native share sheet; everything else copies the link.
function shareCharacter(btn) {
  const url = shareUrl();
  if (navigator.share && window.matchMedia("(pointer: coarse)").matches) {
    navigator.share({ title: "My character – Tavern Portraits", url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => flash(btn, "Link copied!"));
  }
}

// ---------- init ----------
function init() {
  fillSelect($("ruleset"), DATA.rulesets);
  refreshAncestries();
  fillSelect($("gender"), DATA.genders);
  fillSelect($("age"), DATA.ages);
  fillSelect($("build"), DATA.builds);
  fillSelect($("hair"), [...DATA.hairs, "Other"]);
  fillSelect($("eyes"), [...DATA.eyes, "Other"]);
  fillSelect($("skin"), [...DATA.skins, "Other"]);
  fillSelect($("expression"), DATA.expressions);
  fillSelect($("framing"), DATA.framings);
  fillSelect($("weapon"), DATA.weapons);
  fillSelect($("armour"), DATA.armours);
  fillChecks($("accessories"), DATA.accessories);
  fillSelect($("setting"), DATA.settings);
  fillSelect($("lighting"), DATA.lightings);
  fillSelect($("pose"), DATA.poses);
  fillSelect($("style"), DATA.styles);
  fillSelect($("target-model"), DATA.targetModels);

  $("ruleset").addEventListener("change", refreshAncestries);
  $("ancestry").addEventListener("change", () => {
    toggleOther("ancestry", "ancestry-other");
    updateAncestryFields();
  });
  $("class").addEventListener("change", () => toggleOther("class", "class-other"));
  $("style").addEventListener("change", syncStyleFraming);
  FREE_TEXT_TRAITS.forEach(id =>
    $(id).addEventListener("change", () => toggleOther(id, `${id}-other`)));

  document.querySelectorAll("#form-panel select, #form-panel input, #form-panel textarea")
    .forEach(el => el.addEventListener("input", buildPrompt));
  document.querySelectorAll("#form-panel select").forEach(el => el.addEventListener("change", buildPrompt));
  document.querySelectorAll("#accessories input").forEach(cb => cb.addEventListener("change", buildPrompt));

  $("randomize").addEventListener("click", randomize);
  $("clear").addEventListener("click", clearAll);
  $("copy").addEventListener("click", () => copyPrompt($("copy")));
  $("copy-mobile").addEventListener("click", () => copyPrompt($("copy-mobile")));
  $("share").addEventListener("click", () => shareCharacter($("share")));

  // Phone bar: jump to the prompt, or back to the form once the prompt is on screen.
  const outputPanel = document.querySelector(".panel.output");
  let outputVisible = false;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([entry]) => {
      outputVisible = entry.isIntersecting;
      $("jump").textContent = outputVisible ? "Back to form" : "View prompt";
    }, { threshold: 0.25 }).observe(outputPanel);
  }
  $("jump").addEventListener("click", () => {
    const target = outputVisible ? $("form-panel") : outputPanel;
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    target.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  });

  applyUrlSettings();
  buildPrompt();
}

init();
</script>
